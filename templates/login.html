{% extends 'base.html' %}

{% block title %}Admin Security Portal | CST METEO{% endblock %}

{% block styles %}
<style>
  .login-wrapper {
    max-width: 460px;
    margin: 60px auto;
  }
  
  .login-card {
    border-radius: 24px;
    position: relative;
    overflow: hidden;
  }
  
  .login-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--primary), var(--success));
  }
  
  .lock-icon {
    font-size: 45px;
    background: linear-gradient(135deg, var(--primary), var(--success));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    margin-bottom: 20px;
    filter: drop-shadow(0 2px 10px rgba(59, 130, 246, 0.2));
  }
  
  .card-title {
    font-size: 24px;
    margin-bottom: 8px;
    font-weight: 800;
    text-align: center;
    color: #fff;
  }
  
  .card-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 30px;
  }
  
  .form-group {
    margin-bottom: 20px;
    position: relative;
  }
  
  .form-group i {
    position: absolute;
    left: 18px;
    top: 17px;
    color: var(--text-muted);
    font-size: 15px;
  }
  
  .form-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 15px 18px 15px 48px;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
  }
  
  .form-input:focus {
    background: rgba(255, 255, 255, 0.06);
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.18);
  }
  
  .form-input:focus + i {
    color: var(--primary);
  }
  
  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    color: #fff;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
  }
  
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
  }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="glass-card login-card">
    <div class="lock-icon">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <div class="card-title">Administrative Login</div>
    <div class="card-subtitle">Please authenticate to access dashboard control and monitors.</div>
    
    <form action="{{ url_for('admin_login') }}" method="POST">
      <div class="form-group">
        <input type="password" name="password" class="form-input" placeholder="Admin Security Key" required autocomplete="current-password" autofocus>
        <i class="fa-solid fa-lock"></i>
      </div>
      
      <button type="submit" class="btn-submit">
        <i class="fa-solid fa-unlock-keyhole"></i> Unlock Console
      </button>
    </form>
  </div>
</div>
{% endblock %}
